<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bad Apple - GIF to Favicon</title>
  <link id="favicon" rel="icon" type="image/png" href="" />
  <style>
    :root {
      --bg: #050910;
      --panel: rgba(16, 24, 38, 0.8);
      --text: #ecf7ff;
      --accent: #7be2ff;
      --accent-2: #7ef0b5;
      --soft: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(123, 226, 255, 0.18), transparent 30%),
        radial-gradient(circle at bottom, rgba(126, 240, 181, 0.12), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .wrap {
      width: min(90vw, 760px);
      padding: 26px 20px 20px;
      border: 1px solid var(--soft);
      border-radius: 22px;
      background: var(--panel);
      box-shadow:
        0 25px 60px rgba(0,0,0,0.45),
        inset 0 0 32px rgba(123,226,255,0.04);
      text-align: center;
    }

    .title {
      margin: 0 0 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      font-size: 11px;
      opacity: 0.9;
    }

    .subtitle {
      margin: 0 0 16px;
      font-size: 13px;
      color: rgba(236, 247, 255, 0.6);
      font-weight: 400;
    }

    canvas {
      display: block;
      width: min(100%, 500px);
      height: auto;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: #090d14;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow:
        inset 0 0 30px rgba(123,226,255,0.08),
        0 0 20px rgba(123,226,255,0.08);
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      color: #031118;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(123,226,255,0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 34px rgba(123,226,255,0.38);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.8;
      cursor: wait;
    }

    .upload-input {
      display: none;
    }

    .status {
      margin-top: 16px;
      font-size: 12px;
      color: var(--accent);
      opacity: 0.8;
      min-height: 20px;
    }

    .error {
      color: #ff6b6b;
      opacity: 1;
    }

    input[type="file"] {
      display: none;
    }

    label {
      appearance: none;
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      color: #031118;
      background: linear-gradient(135deg, #ff8c42, #ff6b6b);
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(255, 107, 107, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: inline-block;
    }

    label:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 34px rgba(255, 107, 107, 0.38);
    }

    label:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="title">Bad Apple</p>
    <p class="subtitle">GIF → Favicon Animation</p>
    <canvas id="screen" width="360" height="220"></canvas>
    
    <div class="controls">
      <label for="gif-upload">📁 Загрузить GIF</label>
      <input type="file" id="gif-upload" class="upload-input" accept=".gif" />
      <button id="start" disabled>▶ Старт</button>
      <button id="stop" disabled>⏹ Стоп</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script src="gif.js"></script>
  <script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const faviconLink = document.getElementById('favicon');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const gifUpload = document.getElementById('gif-upload');
    const statusDiv = document.getElementById('status');

    let gif = null;
    let frames = [];
    let currentFrameIndex = 0;
    let animationTimer = null;
    let isPlaying = false;

    function setStatus(message, isError = false) {
      statusDiv.textContent = message;
      statusDiv.classList.toggle('error', isError);
    }

    function updateFavicon(imageData) {
      const size = 64;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const d = c.getContext('2d');

      // Масштабируем изображение для favicon
      d.drawImage(imageData, 0, 0, size, size);
      faviconLink.href = c.toDataURL('image/png');
    }

    function drawMainFrame(imageData) {
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      const bg = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      bg.addColorStop(0, '#101a26');
      bg.addColorStop(1, '#090d13');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Рисуем изображение в центр
      const scale = Math.min(w / imageData.width, h / imageData.height) * 0.9;
      const scaledWidth = imageData.width * scale;
      const scaledHeight = imageData.height * scale;
      const offsetX = (w - scaledWidth) / 2;
      const offsetY = (h - scaledHeight) / 2;

      ctx.drawImage(imageData, offsetX, offsetY, scaledWidth, scaledHeight);

      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.strokeRect(12, 12, w - 24, h - 24);
    }

    function playAnimation() {
      if (frames.length === 0) {
        setStatus('❌ Сначала загрузите GIF файл', true);
        return;
      }

      isPlaying = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      currentFrameIndex = 0;
      setStatus('▶ Воспроизведение...');

      const step = () => {
        if (!isPlaying) return;

        const frame = frames[currentFrameIndex % frames.length];
        drawMainFrame(frame.canvas);
        updateFavicon(frame.canvas);
        
        currentFrameIndex++;

        // Используем delay из GIF
        const delay = frame.delay || 100;
        animationTimer = setTimeout(step, delay);
      };

      step();
    }

    function stopAnimation() {
      isPlaying = false;
      if (animationTimer) {
        clearTimeout(animationTimer);
        animationTimer = null;
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus('⏹ Остановлено');
    }

    gifUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      setStatus('⏳ Загрузка GIF...');
      
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const img = new Image();
          img.onload = () => {
            // Парсим GIF
            gif = new GIF({
              workers: 2,
              quality: 10,
              width: img.width,
              height: img.height,
              workerScript: 'gif.worker.js'
            });

            frames = [];
            gif.render();

            gif.on('finished', () => {
              setStatus(`✅ GIF загружен! (${frames.length} кадров)`);
              startBtn.disabled = false;
            });

            gif.on('frame', (canvas) => {
              frames.push({
                canvas: canvas,
                delay: 50
              });
            });

            gif.render();
          };

          img.onerror = () => {
            setStatus('❌ Ошибка загрузки изображения', true);
          };

          img.src = event.target.result;
        } catch (error) {
          setStatus('❌ Ошибка парсинга GIF: ' + error.message, true);
          console.error(error);
        }
      };

      reader.onerror = () => {
        setStatus('❌ Ошибка чтения файла', true);
      };

      reader.readAsDataURL(file);
    });

    startBtn.addEventListener('click', playAnimation);
    stopBtn.addEventListener('click', stopAnimation);

    setStatus('📁 Загрузите GIF файл для начала');
  </script>
</body>
</html>
